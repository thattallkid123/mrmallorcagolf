name: Verify Content And Build

on:
  pull_request:
  push:
    branches:
      - main
  # Lets a run be re-triggered by hand (gh workflow run "Verify Content And Build" --ref main).
  # Added 2026-08-06 after a GitHub Actions incident left runs stuck in "queued" with no jobs
  # ever starting, and no way to retry because push was the only trigger.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run content checks
        run: npm run check:content

      - name: Run release checks
        run: npm run check:i18n-release

      - name: Build site
        run: npm run build
