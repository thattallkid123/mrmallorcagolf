  return text;
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
// Turn bare links in an answer into tappable ones.
function linkify(s) { return esc(s).replace(/https?:\/\/[^\s<]+[^\s<.,)]/g, u => `<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//, '')}</a>`); }

function parseRounds(params) {
  const rounds = [];
  const r = params.get('r');
  if (r) {
    r.split(',').forEach(part => {
      const [c, d, t] = part.split('~');
      rounds.push({ c, d, t: t && /^\d{4}$/.test(t) ? t.slice(0, 2) + ':' + t.slice(2) : t });
    });
  } else if (params.get('c')) {
    rounds.push({ c: params.get('c'), d: params.get('d'), t: params.get('t') });
  }
  return rounds.filter(x => x.c);
}

function niceDate(d) {
  if (!d || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return '';
  const dt = new Date(d + 'T12:00:00');
  return dt.toLocaleDateString(LOCALE[LANG], { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

// Summer runs from the clock change in March to the clock change in October (Arabella's winter
// hours start on the Monday after it). Used to pick the season-specific wording for a round's date.
function lastSunday(y, m) { const d = new Date(Date.UTC(y, m + 1, 0)); d.setUTCDate(d.getUTCDate() - d.getUTCDay()); return d.toISOString().slice(0, 10); }
function seasonFor(d) {
  if (!d || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return null;
  const y = Number(d.slice(0, 4));
  return (d >= lastSunday(y, 9) || d < lastSunday(y, 2)) ? 'winter' : 'summer';
}

// A range opening time for the summary strip, only when the answer is one plain statement (no weekday, season or closure wording).
function rangeTime(text) {
  if (!text || /except|monday|tuesday|wednesday|thursday|friday|saturday|sunday|closed|summer|winter/i.test(text)) return null;
  const m = /^[^.]*\bopens?\b(?: at| from)? (\d{1,2}:\d{2})\b/i.exec(text);
  return m ? m[1].padStart(5, '0') : null;
}
const flat = t => String(t || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

function minusMinutes(t, mins) {
  if (!t || !/^\d{1,2}:\d{2}$/.test(t)) return null;
  const [h, m] = t.split(':').map(Number);
  let total = h * 60 + m - mins;
  if (total < 0) total += 1440;
  return String(Math.floor(total / 60)).padStart(2, '0') + ':' + String(total % 60).padStart(2, '0');
}

function bringList(course, round) {
  const items = [];
  if (course.certificateRequired) {
    const limits = course.handicapMen ? ui('bring_limit', { m: course.handicapMen, w: course.handicapWomen }) : '';
    items.push(ui('bring_cert') + limits);
  }
  // The course's own shoe rule is already listed under "On the course", so the generic line only fills a gap.
  if (!(course.info || {}).shoes) items.push(ui('bring_shoes'));
  items.push((course.info || {}).bringWater ? tx(course.info.bringWater) : ui('bring_water'));
  // With a date the line fits the season (sun from April to October, a warm layer from November to March for an
  // early start); with no date one line covers both, so a winter client is not told the sun is strong.
  const hour = round.t && /^\d{1,2}:/.test(round.t) ? Number(round.t.split(':')[0]) : null;
  const month = round.d && /^\d{4}-\d{2}/.test(round.d) ? Number(round.d.slice(5, 7)) : null;
  if (month === null) items.push(ui('bring_both'));
  else if (month >= 4 && month <= 10) items.push(ui('bring_sun'));
  else if (hour === null || hour < 10) items.push(ui('bring_warm'));
  return items;
}

function renderRound(course, round, closures) {
  const info = course.info || {};
  const season = seasonFor(round.d);
  const seasonal = course.seasonal || {};
  // The wording for this round's season where the club gives different summer and winter answers, else the single answer.
  const valueFor = f => (season && seasonal[f] && seasonal[f][season]) || info[f];
  const when = [niceDate(round.d), round.t ? `${ui('teeTime')} ${esc(round.t)}` : ''].filter(Boolean).join(LANG === 'zh' ? '，' : ', ');
  // A course photo from the website with the title over it; courses with no photo keep the plain title.
  let head = course.hero
    ? `<figure class="hero"><img src="/pre-round-assets/hero/${esc(round.c)}.webp" alt="${esc(ui('photoalt', { name: course.name }))}" width="1000" height="500"><figcaption class="cap"><div class="eyebrow">${ui('eyebrow')}</div><h1>${esc(course.name)}</h1></figcaption></figure>`
    : `<div class="eyebrow">${ui('eyebrow')}</div><h1>${esc(course.name)}</h1>`;
  head += `<p class="round-intro">${ui('round_intro')}</p>`;
  if (when) head += `<div class="when">${when}</div>`;
  (closures || []).filter(c => round.d && (c.courses || []).includes(round.c) && round.d >= c.from && round.d <= c.to)
    .forEach(c => { head += `<div class="notice"><strong>${ui('note')}</strong>${LANG === 'zh' ? '' : ' '}${esc(tx(c.text))}</div>`; });
  if (info.checkInMinutes) {
    const by = minusMinutes(round.t, info.checkInMinutes);
    const advice = (course.meetAtGate ? ui('meet_note', { n: info.checkInMinutes }) : ui('checkin_note', { n: info.checkInMinutes })).trim();
    if (by && round.t) {
      // Summary strip: when to be there, the tee time, and when the range opens if the answer says so plainly.
      const rt = rangeTime(valueFor('rangeOpens'));
      const tile = (k, v, sub) => `<div class="tile"><div class="k">${k}</div><div class="v">${esc(v)}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>`;
      head += `<div class="checkin"><div class="tiles">`
        + (course.meetAtGate ? tile(ui('t_there'), by) : tile(ui('t_checkin'), by, ui('t_proshop')))
        + tile(ui('t_tee'), round.t) + (rt ? tile(ui('t_range'), rt) : '')
        + `</div><div class="advice">${advice}</div></div>`;
    } else {
      const main = course.meetAtGate ? ui('meet_plain') : ui('checkin_plain') + '.';
      head += `<div class="checkin"><div class="main">${main}</div><div class="advice">${advice}</div></div>`;
    }
  }
  let shareBtn = '';
  let shareText = '';
  let contactHtml = '';
  // A WhatsApp message a client can send to the people they are playing with: course, day, when to be there, directions, and this page.
  {
    const by = round.t && info.checkInMinutes ? minusMinutes(round.t, info.checkInMinutes) : null;
    const place = course.mapsDestination || (course.mapsQuery ? encodeURIComponent(course.mapsQuery) : '');
    const lines = [[course.name, niceDate(round.d), round.t ? `${ui('teeTime')} ${round.t}` : ''].filter(Boolean).join(', ')];
    if (by) lines.push(ui('msg_by', { time: by }));
    if (course.address) lines.push(course.address);
    if (place) lines.push(ui('msg_dir') + ': https://www.google.com/maps/dir/?api=1&destination=' + place);
    const part = [round.c, round.d || '', round.t ? round.t.replace(':', '') : ''].join('~').replace(/~+$/, '');
    lines.push(ui('msg_all') + ': ' + location.origin + location.pathname + '?r=' + part + (LANG !== 'en' ? '&lang=' + LANG : ''));
    shareText = lines.join('\n');
    shareBtn = `<div class="btns share"><a class="btn alt" href="https://wa.me/?text=${encodeURIComponent(shareText)}" target="_blank" rel="noopener">${ui('share')}</a><button class="btn alt copy-info" type="button" data-copy="${esc(shareText)}">${ui('copy')}</button></div><p class="copy-status" role="status"></p><div class="copy-fallback" hidden><p>${ui('copy_manual')}</p><textarea readonly aria-label="${esc(ui('copy'))}"></textarea></div>`;
  }

  let html = '';
  let any = false;
  GROUPS.forEach(([title, fields]) => {
    const rows = fields.filter(f => (f === 'restaurants' ? (course.restaurants || []).length : f === 'travel' ? course.travel : valueFor(f)) && !(f === 'shoes' && valueFor('dressCode')));
    if (!rows.length) return;
    any = true;
    const card = f => {
      if (f === 'travel') return `<div class="item"><dt>${ui('l_travel')}</dt><dd>${esc(ui('travel_text', { p: course.travel.palma, a: course.travel.airport }))}</dd></div>`;
      if (f === 'restaurants') return `<div class="item"><dt>${ui('l_restaurants')}</dt>` + course.restaurants.map(r => `<dd><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a>${r.note ? ' &ndash; ' + esc(tx(r.note)) : ''}</dd>`).join('') + '</div>';
      if (f !== 'dressCode') return `<div class="item"><dt>${ui('l_' + f)}</dt><dd>${linkify(tx(valueFor(f)))}</dd>${f === 'hireBags' && course.rentalUrl ? `<dd><a href="${esc(course.rentalUrl)}" target="_blank" rel="noopener">${ui('rental_link')} &#8599;</a></dd>` : ''}${f === 'licence' && course.licenceUrl ? `<dd><a class="btn alt" href="${esc(course.licenceUrl)}" target="_blank" rel="noopener">${ui('licence_link')} &#8599;</a></dd>` : ''}</div>`;
      // One card for the clothing and the shoes; the shoe rule is left out when the dress code already says it.
      const shoes = valueFor('shoes');
      const dup = shoes && flat(valueFor('dressCode')).includes(flat(shoes));
      return `<div class="item"><dt>${ui(shoes ? 'l_dressShoes' : 'l_dressCode')}</dt><dd>${linkify(tx(valueFor('dressCode')))}</dd>${shoes && !dup ? `<dd>${linkify(tx(shoes))}</dd>` : ''}</div>`;
    };
    html += `<h2>${ui(title)}</h2><dl>` + rows.map(card).join('') + '</dl>';
  });
  if (!any) html += `<p class="muted later">${ui('later')}</p>`;
  html += `<h2>${ui('g_bring')}</h2><ul class="bring">` + bringList(course, round).map(i => `<li>${esc(i)}</li>`).join('') + '</ul>';
  if (course.contact && (course.contact.phone || course.contact.email)) {
    const tel = String(course.contact.phone || '').replace(/[^\d+]/g, '');
    contactHtml = `<div class="railbox"><h2>${ui('contact_h')}</h2><p>${ui('contact_p')}</p><div class="contacts">`
      + (tel ? `<div><span class="label">${ui('call')}</span><a href="tel:${tel}">${esc(course.contact.phone)}</a></div>` : '')
      + (course.contact.email ? `<div><span class="label">${ui('emailclub')}</span><a href="mailto:${esc(course.contact.email)}">${esc(course.contact.email)}</a></div>` : '')
      + '</div></div>';
  }
  // The map picture on the left (on a phone, above everything): tap it for directions in Google Maps. It is centred on the
  // club pin Google gives (its clubhouse; Santa Ponsa 2 is the gate), and the route goes to the same point.
  const dest = course.mapsDestination || (course.mapsQuery ? encodeURIComponent(course.mapsQuery) : (course.lat && course.lng ? course.lat + ',' + course.lng : ''));
  const mapLink = dest ? `https://www.google.com/maps/dir/?api=1&destination=${dest}` : '';
  const rail = (course.map && mapLink
    ? `<a class="map" href="${mapLink}" target="_blank" rel="noopener" aria-label="${esc(ui('directions'))}"><img src="/pre-round-assets/maps/${esc(round.c)}.jpg" alt="${esc(ui('mapalt', { name: course.name }))}" width="640" height="480" loading="lazy"><span class="map-directions">${ui('directions')} &#8599;</span></a>`
    : (mapLink ? `<a class="btn" href="${mapLink}" target="_blank" rel="noopener">${ui('directions')}</a>` : ''))
    + (course.address ? `<div class="addr">${esc(course.address)}</div>` : '')
    + (course.guideUrl ? `<div class="btns guide"><a class="btn alt" href="${esc(course.guideUrl)}" target="_blank" rel="noopener">${ui('guide_link')} &#8599;</a></div>` : '')
    + contactHtml + shareBtn;
  return `<section class="round"><div class="top"><a class="backlink" href="?${LANG !== 'en' ? 'lang=' + LANG : ''}">&larr; ${ui('all_courses')}</a>${head}</div><div class="cols"><aside class="rail">${rail}</aside><div class="body">${html}</div></div></section>`;
}

function renderPicker(data) {
  const opts = Object.entries(data.courses).filter(([, c]) => !c.pickerHidden).sort((a, b) => a[1].name.localeCompare(b[1].name))
    .map(([id, c]) => `<option value="${id}">${esc(c.name)}</option>`).join('');
  return `<div class="narrow"><div class="eyebrow">${ui('eyebrow')}</div><h1>${ui('picker_h')}</h1><p>${ui('picker_p')}</p>
    <div class="picker"><select id="pick"><option value="">${ui('picker_opt')}</option>${opts}</select></div></div>`;
}

async function main() {
  const app = document.getElementById('app');
  document.documentElement.lang = LANG;
  document.title = ui('title');
  const NAMES = { en: 'English', de: 'Deutsch', es: 'Español', fr: 'Français', nl: 'Nederlands', sv: 'Svenska', zh: '中文' };
  const langBox = document.getElementById('langs');
  langBox.innerHTML = `<summary aria-label="${esc(ui('language'))}: ${NAMES[LANG]}">${LANG.toUpperCase()}</summary><nav class="menu" aria-label="${esc(ui('language'))}">` + [LANG, ...SUPPORTED.filter(l => l !== LANG)].map(l => {
    const p = new URLSearchParams(location.search); p.set('lang', l);
    return `<a href="?${p.toString()}" class="${l === LANG ? 'on' : ''}" hreflang="${l}"${l === LANG ? ' aria-current="true"' : ''}>${NAMES[l]}<span>${l.toUpperCase()}</span></a>`;
  }).join('') + '</nav>';
  document.addEventListener('click', e => { if (!langBox.contains(e.target)) langBox.removeAttribute('open'); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && langBox.open) { langBox.open = false; langBox.querySelector('summary').focus(); } });
  app.innerHTML = `<p class="muted">${ui('loading')}</p>`;
  // Both files are fetched together, each retried a couple of times so a dropped request on a poor connection does not leave the page in English.
  const getJson = async url => {
    for (let attempt = 0; attempt < 5; attempt++) {
      try { const res = await fetch(url, { cache: 'no-store' }); if (res.ok) return await res.json(); } catch (e) { /* try again */ }
      await new Promise(r => setTimeout(r, 300 * (attempt + 1)));
    }
    throw new Error('Could not load ' + url);
  };
  let data;
  try {
    const [info, phrases] = await Promise.all([
      getJson('/pre-round-assets/round-info.json'),
      LANG !== 'en' ? getJson('/pre-round-assets/round-info.i18n.json').catch(() => ({})) : Promise.resolve({})
    ]);
    data = info;
    PHRASES = phrases[LANG] || {};
  } catch (e) {
    app.innerHTML = `<p>${ui('error', { wa: WHATSAPP })}</p>`;
    return;
  }
  const rounds = parseRounds(new URLSearchParams(location.search)).filter(r => data.courses[r.c]);
  let html = rounds.length ? rounds.map(r => renderRound(data.courses[r.c], r, data.closures)).join('') : renderPicker(data);
  html += `<footer><div class="footer-copy"><p class="muted">${ui('footer_a')}</p><p>${ui('footer_b')}</p></div><a class="btn alt" href="${WHATSAPP}">${ui('whatsapp')}</a></footer>`;
  app.innerHTML = html;
  app.setAttribute('aria-busy', 'false');
  app.querySelectorAll('.copy-info').forEach(button => button.addEventListener('click', async () => {
    const rail = button.closest('.rail');
    const status = rail.querySelector('.copy-status');
    const fallback = rail.querySelector('.copy-fallback');
    try {
      await navigator.clipboard.writeText(button.dataset.copy);
      status.textContent = ui('copied');
      fallback.hidden = true;
    } catch (e) {
      status.textContent = '';
      fallback.hidden = false;
      const field = fallback.querySelector('textarea');
      field.value = button.dataset.copy;
      field.focus();
      field.select();
    }
  }));
  const pick = document.getElementById('pick');
  if (pick) pick.addEventListener('change', () => { if (pick.value) location.search = '?c=' + encodeURIComponent(pick.value) + (LANG !== 'en' ? '&lang=' + LANG : ''); });
}
const loadTimer = window.setTimeout(() => {
  const app = document.getElementById('app');
  if (app.getAttribute('aria-busy') === 'true') {
    app.innerHTML = '<h1>' + ui('picker_h') + '</h1><p>' + ui('error', { wa: WHATSAPP }) + '</p>';
    app.setAttribute('aria-busy', 'false');
  }
}, 12000);
main().catch(() => {
  const app = document.getElementById('app');
  app.innerHTML = '<h1>' + ui('picker_h') + '</h1><p>' + ui('error', { wa: WHATSAPP }) + '</p>';
  app.setAttribute('aria-busy', 'false');
}).finally(() => { window.clearTimeout(loadTimer); document.getElementById("app").setAttribute("aria-busy", "false"); });
</script>
</body>
</html>
